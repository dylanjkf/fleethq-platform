name: Seed Titan demo

# Manually-triggered, one-click seed of the production-safe Titan demo tenant
# (scripts/seed-titan-demo.ts) into the LIVE database, so you can click around a
# realistic fleet in the real product. This is safe by construction — it creates
# ONE admin login (strong password, never a default) and login-less driver
# operators, all in a single tenant isolated by row-level security. See the
# script header for the full safety rationale.
#
# There is no push/schedule trigger: it only ever runs when a human clicks
# "Run workflow" and types the confirmation phrase, so it can't fire by accident.
#
# The seed runs on a GitHub-hosted runner, which is OUTSIDE Railway's private
# network — so it connects to Postgres over its PUBLIC proxy URL, not the
# internal `postgres.railway.internal` host (which only resolves inside Railway
# and gave a "Can't reach database server" error when we went through
# `railway run`).
#
# One-time setup (repo Settings → Secrets and variables → Actions → Secrets):
#   - Secret  SEED_DATABASE_URL     — REQUIRED. The Postgres PUBLIC connection
#       string. In Railway: open the Postgres service → Variables → copy
#       DATABASE_PUBLIC_URL (if there is no public URL, enable "Public
#       Networking" on that service first). It looks like:
#         postgresql://postgres:<pw>@<host>.proxy.rlwy.net:<port>/railway
#   - Secret  TITAN_ADMIN_PASSWORD  — optional. The demo admin's password (>= 12
#       chars). If unset, the script generates a strong one and prints it once in
#       the run log (visible to anyone with Actions read access) — set the secret
#       if you'd rather it stay out of the logs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "SEED TITAN DEMO" to confirm seeding the LIVE database'
        required: true
        default: ''

concurrency:
  group: seed-titan-demo
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        # Refuse unless the operator typed the exact phrase. A mistyped/empty box
        # stops here before anything touches the database.
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "SEED TITAN DEMO" ]; then
            echo "::error::Confirmation phrase not matched — nothing was seeded. Re-run and type exactly: SEED TITAN DEMO"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Preflight — public DB URL present
        env:
          SEED_DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          if [ -z "$SEED_DATABASE_URL" ]; then
            echo "::error::Secret SEED_DATABASE_URL is not set. Add it in repo Settings → Secrets and variables → Actions: the Postgres PUBLIC connection string (Railway → Postgres service → Variables → DATABASE_PUBLIC_URL)."
            exit 1
          fi

      - name: Install deps + generate Prisma client
        working-directory: api
        run: |
          npm ci
          npx prisma generate

      - name: Apply pending database migrations
        working-directory: api
        # The database must match the schema the seed (and the deployed API)
        # expect. Production's migrations are NOT applied on deploy — the Docker
        # entrypoint only migrates when RUN_MIGRATIONS_ON_BOOT is set, and the
        # deploy workflow just runs `railway up` — so the DB was behind.
        #
        # The 20260713063137_row_level_security migration failed on Railway back
        # on 2026-07-30 (it hardcoded `GRANT CONNECT ON DATABASE fleetos`, but
        # Railway's DB is named `railway`), which left it half-applied and made
        # `migrate deploy` refuse everything since with P3009. That GRANT is now
        # fixed to use current_database(); this step marks the failed migration
        # rolled back so `migrate deploy` re-applies the corrected version and
        # then all the migrations queued behind it.
        #
        # `migrate resolve --rolled-back` only touches a migration that is in a
        # FAILED state — once it has been re-applied successfully, this command
        # errors (hence `|| true`) and the deploy below is a clean no-op, so the
        # step stays safe to re-run.
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          npx prisma migrate resolve --rolled-back 20260713063137_row_level_security || true
          npx prisma migrate deploy

      - name: Seed reference data (asset classes, permissions, system roles)
        working-directory: api
        # The database has the tables (migrations) but no reference data — the
        # built-in asset classes (e.g. LAND) and the permission catalog were
        # never seeded, so the Titan seed failed with "No AssetClass found".
        # `prisma/seed.ts` bootstraps exactly that. With NODE_ENV=production it
        # seeds ONLY reference data + system roles and returns before any demo
        # company (no default-credential accounts) — it is the same reference-data
        # bootstrap a production deploy is meant to run. Idempotent (upserts).
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
          NODE_ENV: production
        run: npm run seed

      - name: Seed Titan demo into the live database
        working-directory: api
        # Connects directly to the public Postgres proxy (reachable from the
        # runner). TITAN_DEMO_CONFIRM is the script's own opt-in gate;
        # TITAN_ADMIN_PASSWORD is the demo admin's password (the script generates
        # and prints one if the secret is unset).
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
          TITAN_DEMO_CONFIRM: SEED_TITAN_DEMO
          TITAN_ADMIN_PASSWORD: ${{ secrets.TITAN_ADMIN_PASSWORD }}
        run: npm run seed:titan:demo
