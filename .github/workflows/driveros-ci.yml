name: driveros-ci

on:
  push:
    branches: [main]
    paths:
      - 'driveros/**'
      - '.github/workflows/driveros-ci.yml'
  pull_request:
    paths:
      - 'driveros/**'
      - '.github/workflows/driveros-ci.yml'

defaults:
  run:
    working-directory: driveros

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: driveros/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test
