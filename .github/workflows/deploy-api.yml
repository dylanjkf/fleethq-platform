name: deploy-api

# Auto-deploy the API to Railway — but ONLY after api-ci has actually passed on the
# same commit. This workflow is triggered by api-ci completing (workflow_run), not by
# the raw push, so a commit whose lint/typecheck/migrate/build/tests failed can never
# reach production. A merge that changed nothing under api/ doesn't run api-ci at all
# (api-ci has its own api/** path filter), so it also never triggers a deploy; use the
# manual "Run workflow" button (workflow_dispatch) to force one anyway.
#
# Safety, in layers:
#   1. CI gate — this job only runs when the triggering api-ci run concluded 'success'
#      (see the `if:` below). workflow_run fires on failure too, so the guard is required.
#   2. Exact-SHA deploy — it checks out the precise commit CI validated
#      (github.event.workflow_run.head_sha), not whatever the branch tip happens to be
#      by the time the deploy runs, so what ships is exactly what was tested.
#   3. Runtime — railway.json runs a single replica with healthcheckPath /health/ready,
#      and api/docker-entrypoint.sh applies `prisma migrate deploy` before the app
#      starts. A broken build fails the healthcheck and Railway keeps the previous
#      version live rather than serving the bad one.
#
# Note: required-review branch protection on main (backed by the CODEOWNERS file at the
# repo root) is the other half of this gate — CI-must-pass protects the deploy, review
# protects what reaches main in the first place. See docs and the operator runbooks.
#
# One-time setup (repo Settings):
#   - Secret  RAILWAY_TOKEN   — a Railway *project* or *account* token with deploy
#                               rights (Railway → project → Settings → Tokens).
#   - Variable RAILWAY_SERVICE — the exact API service name shown in Railway.
# Without both, the job stops early with a clear message instead of half-deploying.

on:
  # Fires when api-ci finishes on main. The `if:` guard below drops the run unless
  # that api-ci run actually succeeded, so only green commits deploy.
  workflow_run:
    workflows: ["api-ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never let two deploys of the same service overlap; a newer push supersedes an
# in-flight one rather than racing it.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when the CI run succeeded (workflow_run also fires on failure/cancel),
    # or when a human explicitly forces it via the Run-workflow button.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit api-ci validated. On workflow_dispatch there is no
          # triggering run, so fall back to the ref the dispatch targeted.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Need main's history to decide whether this commit is still the latest.
          fetch-depth: 0

      - name: Recency guard — don't ship an already-superseded commit
        # Closes the out-of-order deploy race: if an older commit's api-ci finishes
        # AFTER a newer commit has already landed on main (slow CI on the earlier
        # push), the concurrency queue would still run this older deploy last and
        # regress production to stale code. So before deploying, compare the commit
        # being shipped against main's current tip. If main has already advanced
        # past it, stand down — the newer commit's own deploy is authoritative.
        # Manual dispatches are exempt: an operator forcing a specific ref means it.
        #
        # FAIL-CLOSED (R5 Critical #1): when superseded, this step both sets
        # SUPERSEDED=1 (belt) AND `exit 1` (braces). The exit is what actually stops
        # the deploy — a red guard means no later step runs at all, so forgetting an
        # `if:` on any future downstream step can't silently re-open the race the way
        # it did before (Install/Deploy had no condition and deployed regardless).
        # The downstream `if: env.SUPERSEDED != '1'` conditions are kept as a second
        # layer in case the exit is ever softened. A red run here is the intended,
        # visible signal "this stale deploy was refused", not a failure to fix.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          git fetch --quiet origin main
          MAIN_TIP="$(git rev-parse origin/main)"
          echo "Deploying: $DEPLOY_SHA"
          echo "main tip:  $MAIN_TIP"
          if [ "$DEPLOY_SHA" = "$MAIN_TIP" ]; then
            echo "This commit is main's tip — proceeding."
            exit 0
          fi
          if git merge-base --is-ancestor "$DEPLOY_SHA" "$MAIN_TIP"; then
            echo "SUPERSEDED=1" >> "$GITHUB_ENV"
            echo "::error::main has already advanced past $DEPLOY_SHA to $MAIN_TIP." \
                 "A newer commit's deploy supersedes this one — standing down (fail-closed)" \
                 "to avoid shipping stale code over newer."
            exit 1
          else
            echo "$DEPLOY_SHA is not an ancestor of main tip (diverged/branch) — proceeding."
          fi

      - name: Preflight — required secret/variable present
        if: ${{ env.SUPERSEDED != '1' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          missing=""
          [ -n "$RAILWAY_TOKEN" ]   || missing="$missing RAILWAY_TOKEN(secret)"
          [ -n "$RAILWAY_SERVICE" ] || missing="$missing RAILWAY_SERVICE(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required config:$missing — set them in repo Settings (see workflow header). Skipping deploy."
            exit 1
          fi

      - name: Install Railway CLI
        # Second layer behind the fail-closed guard above (R5 Critical #1): even if
        # the guard's `exit 1` is ever removed, a superseded run still won't install
        # the CLI or deploy.
        if: ${{ env.SUPERSEDED != '1' }}
        run: npm install -g @railway/cli

      - name: Deploy api/ to Railway
        if: ${{ env.SUPERSEDED != '1' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        # Run from the repo ROOT (not api/): the Railway service has its Root
        # Directory set to `api`, so it descends into an `api/` folder inside the
        # uploaded snapshot. Uploading from api/ instead put the api contents at
        # the snapshot root with no `api/` subdir, which failed the build with
        # "lstat …/snapshot-target-unpack/api: no such file or directory".
        # A root .railwayignore keeps the upload to just what api/ needs.
        # --ci keeps it non-interactive; the build + healthcheck run on Railway.
        run: railway up --ci --service "$RAILWAY_SERVICE"

      - name: Post-deploy smoke test — /health/ready must respond
        # R5 High #4: make the "deploy succeeded" claim self-verifying instead of a
        # hand-written narrative. After railway up returns, hit the live readiness
        # endpoint (which pings Postgres) and FAIL the job if it never comes back
        # healthy — so the workflow's own pass/fail IS the evidence the next audit
        # can trust, no manual re-check needed.
        #
        # Activation is a one-time repo Settings step: set the `API_HEALTH_URL`
        # variable to the API's public readiness URL (e.g.
        # https://api.fleethq.online/health/ready). Until it is set, this step
        # emits a visible warning and passes, exactly like the RAILWAY_* preflight —
        # it can't hard-fail on config that isn't wired yet, but it also never
        # silently claims success it didn't verify.
        if: ${{ env.SUPERSEDED != '1' }}
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "::warning::API_HEALTH_URL not set — post-deploy smoke test skipped." \
                 "Set it in repo Settings → Variables (Actions) to the API's public" \
                 "/health/ready URL to make deploys self-verifying (R5 High #4)."
            exit 0
          fi
          echo "Smoke-testing $API_HEALTH_URL after deploy…"
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 10 "$API_HEALTH_URL" || echo 000)"
            body="$(cat /tmp/ready.json 2>/dev/null || true)"
            echo "attempt $attempt/12 → HTTP $code ${body:0:200}"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "✅ Post-deploy readiness confirmed at $API_HEALTH_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Post-deploy smoke test FAILED: $API_HEALTH_URL never reported ready (HTTP 200 + status:ok) within ~3 min. The deploy may be unhealthy."
          exit 1
