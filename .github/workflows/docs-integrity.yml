name: docs-integrity

# Guards against the "fabricated-infrastructure" documentation pattern the
# production-readiness audits flagged as Critical four rounds running: docs that
# describe an AWS/Terraform target stack (RDS, KMS, CloudFront, ECS/Fargate, ALB,
# VPC, Secrets Manager, `infra/terraform/*`, …) in present-tense "already built"
# language, when no such infrastructure exists in this repo (the app runs on
# Railway + Vercel).
#
# The old version of this gate only checked that a file mentioning `infra/terraform`
# contained a qualifier *somewhere* in the file. That was too weak: a banner at the
# top of a file "qualified" a false present-tense claim 100 lines below it. The gate
# is now a PROXIMITY-SCOPED Python checker (`scripts/check-doc-integrity.py`): a
# present-tense infra claim is a violation unless a planned/target qualifier appears
# WITHIN 5 LINES of it, so the reader sees "planned" right where the claim is made.
#
# The workflow runs the checker's built-in `--selftest` first, so the guard can
# never silently rot into a no-op: the self-test proves it still FAILS fabricated
# claims and PASSES correctly-qualified / genuinely-real ones before it is trusted
# to scan the tree.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'FleetOS-Playbook/**'
      - 'README.md'
      - 'scripts/check-doc-integrity.py'
      - '.github/workflows/docs-integrity.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'FleetOS-Playbook/**'
      - 'README.md'
      - 'scripts/check-doc-integrity.py'
      - '.github/workflows/docs-integrity.yml'

jobs:
  fabricated-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test the guard (must flag fabricated, pass qualified/real)
        run: python3 scripts/check-doc-integrity.py --selftest

      - name: Scan docs for unqualified infrastructure claims
        run: python3 scripts/check-doc-integrity.py
