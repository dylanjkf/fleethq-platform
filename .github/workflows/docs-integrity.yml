name: docs-integrity

# Guards against the "fabricated-infrastructure" documentation pattern the
# production-readiness audits flagged as Critical three rounds running: docs that
# describe AWS/Terraform infrastructure (RDS, KMS, CloudFront, `infra/terraform/*`)
# in present-tense "already built" language, when no such Terraform exists in this
# repo. The rule is simple and mechanical, so the pattern can't quietly reappear in
# a doc nobody thought to re-audit: ANY doc under docs/ or FleetOS-Playbook/ that
# mentions `infra/terraform` MUST also carry a planned/target-architecture
# qualifier, so a reader is never told planned infra is real.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'FleetOS-Playbook/**'
      - '.github/workflows/docs-integrity.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'FleetOS-Playbook/**'
      - '.github/workflows/docs-integrity.yml'

jobs:
  fabricated-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No unqualified infra/terraform claims in docs
        run: |
          # A doc may reference infra/terraform ONLY if it also contains one of
          # these planned-architecture qualifiers somewhere in the file. CHANGELOG
          # is historical record and is exempt.
          QUALIFIER='planned architecture|target architecture|not yet built|not yet provisioned|does not exist yet|planned-infra-doc|Planned \('
          fail=0
          while IFS= read -r file; do
            case "$file" in
              */CHANGELOG.md) continue ;;
            esac
            if ! grep -qiE "$QUALIFIER" "$file"; then
              echo "::error file=$file::mentions infra/terraform but has no planned/target-architecture qualifier — add the planned-infra banner or reword to Planned (see docs-integrity.yml)."
              fail=1
            fi
          done < <(grep -rIl "infra/terraform" docs/ FleetOS-Playbook/ 2>/dev/null || true)
          if [ "$fail" -ne 0 ]; then
            echo "Fabricated-infrastructure doc check failed. See errors above."
            exit 1
          fi
          echo "OK — every doc referencing infra/terraform carries a planned/target-architecture qualifier."
