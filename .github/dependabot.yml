# Dependabot: keep dependencies patched, with a bias toward security updates.
# Minimal config per the production-readiness audit (no Dependabot/Renovate
# existed in any repo). Weekly cadence, PRs grouped so a routine bump week is
# one review, and github-actions pinning kept current alongside npm.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
