services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetos
      POSTGRES_PASSWORD: fleetos_dev_only
      POSTGRES_DB: fleetos
    ports:
      - '5432:5432'
    volumes:
      - fleetos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleetos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fleetos_postgres_data:
